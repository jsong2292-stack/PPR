  function renderHyp(h,i){const cls=h.engineerDecision==='confirmed'?'confirmed':h.engineerDecision==='rejected'?'rejected':'';return `<article class="hyp-card ${cls}"><div class="hyp-top"><div class="rank">${i+1}</div><div><h3>${h.hypothesis}</h3><span class="tag ai">AI 原始假设</span> <span class="tag neutral">6M · ${h.rootCauseCategory}</span></div></div><div class="hyp-body"><div class="evidence-group"><b>支持证据</b>${h.supportingEvidence.map(e=>`<button class="evidence-item" data-time="${e.time||''}" data-metric="${state.metric}">↗ ${e.text}</button>`).join('')}</div><div class="evidence-group"><b>反向证据</b>${h.contradictingEvidence.map(e=>`<button class="evidence-item" data-time="${e.time||''}" data-metric="${state.metric}">↗ ${e.text}</button>`).join('')}</div><div class="evidence-group"><b>证据缺口</b><div class="gap-note">${h.missingEvidence}</div></div><div class="evidence-group"><b>推荐验证动作</b><div class="gap-note">${h.validationActions}</div></div><div class="hyp-actions"><button class="btn small decision-btn decision-confirm" data-hyp="${h.id}" data-decision="confirmed">确认</button><button class="btn small decision-btn decision-reject" data-hyp="${h.id}" data-decision="rejected">否决</button><button class="btn small decision-btn" data-hyp="${h.id}" data-decision="pending">待验证</button><span class="tag ${h.engineerDecision}">${{confirmed:'工程师已确认',rejected:'工程师已否决',pending:'待验证'}[h.engineerDecision]}</span></div><div class="verify-form"><label>验证方法</label><textarea class="textarea hyp-input" data-hyp="${h.id}" data-field="validationMethod">${esc(h.validationMethod)}</textarea><label>验证结果 / 实际发现</label><textarea class="textarea hyp-input" data-hyp="${h.id}" data-field="validationResult" placeholder="填写复测、记录核对或现场验证结果">${esc(h.validationResult)}</textarea><label>补充证据 / 最终处理意见</label><textarea class="textarea hyp-input" data-hyp="${h.id}" data-field="engineerComment" placeholder="工程师备注">${esc(h.engineerComment)}</textarea></div></div></article>`}
  function renderDeviations(){const g=golden(),p=sc().process.at(-1);const list=[{key:'haulOffSpeed',name:'牵引速度',cur:p.haulOffSpeed,base:g.process.haulOffSpeed,unit:'m/min',metric:'最小壁厚',complete:'完整'},{key:'temperature',name:'生产温度',cur:p.temperature,base:g.process.temperature,unit:'°C',metric:'最小壁厚',complete:'汇总值'}];return list.map(x=>{const dev=Math.abs((x.cur-x.base)/x.base*100);return `<button class="deviation ${state.processParam===x.key?'active':''}" data-param="${x.key}"><div class="dev-head"><b>${x.name}</b><strong class="num">${fmt(dev,2)}%</strong></div><div class="bar"><i style="width:${Math.min(100,dev*35)}%"></i></div><div class="dev-meta"><span>${fmt(x.cur,2)} ${x.unit} vs ${fmt(x.base,2)} ${x.unit}</span><span>${x.metric} · 数据${x.complete}</span></div></button>`}).join('')}
  function runAI(){clearInterval(aiTimer);state.ai[state.scenario]='running';save();const steps=$$('#aiSteps .ai-step');let i=0;$('#runAI').disabled=true;aiTimer=setInterval(()=>{if(steps[i]){steps[i].classList.remove('running');steps[i].classList.add('done');steps[i].querySelector('i').textContent='✓'}i++;if(steps[i])steps[i].classList.add('running');if(i>=steps.length){clearInterval(aiTimer);state.ai[state.scenario]='done';state.history.push({scenario:state.scenario,type:'ai',time:new Date().toLocaleString('zh-CN'),action:`生成 ${getHypotheses().length} 个待验证根因假设`});save();toast('AI 已生成待验证根因假设');renderP2();setTimeout(renderCharts,0)}},460)}

  function adminImportHeaders(tableKey){

  function adminLocalDate(date){const pad=value=>String(value).padStart(2,'0');return `${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())}T${pad(date.getHours())}:${pad(date.getMinutes())}`}
  function normalizeAdminImportValue(value,type){
    if(value==null||String(value).trim()==='')return type==='number'?null:type.startsWith('multi')?[]:'';
    if(type==='number'){
      const number=typeof value==='number'?value:Number(String(value).trim());
      if(!Number.isFinite(number))throw new Error('必须是有效数字');
      return number;
    }
    if(type==='datetime-local'){
      if(value instanceof Date&&!Number.isNaN(value.getTime()))return adminLocalDate(value);
      if(typeof value==='number'&&typeof XLSX!=='undefined'){
        const parts=XLSX.SSF.parse_date_code(value);
        if(parts)return `${parts.y}-${String(parts.m).padStart(2,'0')}-${String(parts.d).padStart(2,'0')}T${String(parts.H).padStart(2,'0')}:${String(parts.M).padStart(2,'0')}`;
      }
      const text=String(value).trim().replace(/\//g,'-').replace(' ','T');
      if(/^\d{4}-\d{1,2}-\d{1,2}(T\d{1,2}:\d{2}(:\d{2})?)?$/.test(text)){
        const [date,time='00:00']=text.split('T'),[year,month,day]=date.split('-');
        return `${year}-${month.padStart(2,'0')}-${day.padStart(2,'0')}T${time.slice(0,5).padStart(5,'0')}`;
      }
      const parsed=new Date(value);
      if(Number.isNaN(parsed.getTime()))throw new Error('必须是有效日期时间');
      return adminLocalDate(parsed);
    }
    if(type.startsWith('multi:')||type.startsWith('multiRef:')){
      const labels={...processFactorLabels,...Object.fromEntries(Object.entries(processFactorLabels).map(([key,label])=>[label,key]))};
      if(type.startsWith('multiRef:'))adminState.tables[type.slice(9)].forEach(item=>{labels[item.name]=item.id;labels[item.id]=item.id});
      return String(value).split(/[,，;；\n]/).map(item=>item.trim()).filter(Boolean).map(item=>labels[item]||item);
    }
    return String(value).trim();
  }
  function validateAdminImport(tableKey,grid,tables=adminState.tables){
    const cfg=adminTables[tableKey],errors=[],rows=[];
    if(!Array.isArray(grid)||grid.length<2)return {rows,errors:['Excel 中没有可导入的数据行']};
    const aliases=adminImportHeaders(tableKey),fieldIndexes={},unknown=[];
    grid[0].forEach((cell,index)=>{
      const header=String(cell??'').trim();
      if(!header)return;
      const key=aliases[header.replace(/\s*\*\s*$/,'').toLocaleLowerCase()];
      if(!key){if(!/^(__EMPTY|unnamed:)/i.test(header))unknown.push(header);return}
      if(fieldIndexes[key]!=null){unknown.push(`重复列：${header}`);return}
      fieldIndexes[key]=index;
    });
    if(unknown.length)errors.push(`表头无法识别：${unknown.join('、')}`);
    cfg.fields.filter(([, , ,required])=>required).forEach(([key,label])=>{if(fieldIndexes[key]==null)errors.push(`缺少必填列：${label}`)});
    if(errors.length)return {rows,errors};
    const occupiedIds=new Set(tables[tableKey].map(row=>String(row.id)));
    grid.slice(1).forEach((cells,index)=>{
      if(!cells||!cells.some(value=>value!=null&&String(value).trim()!==''))return;
      const rowNumber=index+2,row={},rowErrors=[];
      cfg.fields.forEach(([key,label,type,required])=>{
        const raw=fieldIndexes[key]==null?null:cells[fieldIndexes[key]];
        try{row[key]=normalizeAdminImportValue(raw,type)}catch(error){rowErrors.push(`${label}${error.message}`)}
        if(required&&(row[key]==null||row[key]===''||(Array.isArray(row[key])&&!row[key].length)))rowErrors.push(`${label}不能为空`);
        if(type.startsWith('select:')&&row[key]&&!type.slice(7).split(',').includes(row[key]))rowErrors.push(`${label}不在允许选项中`);
        if(type.startsWith('multi:'))row[key].forEach(value=>{if(!type.slice(6).split(',').includes(value))rowErrors.push(`${label}包含无效值：${value}`)});
      });
      cfg.fields.forEach(([key,label,type])=>{
        if(row[key]==null||row[key]==='')return;
        if(type.startsWith('ref:')){
          const [refKey,typeFilter]=type.slice(4).split(':'),ref=tables[refKey].find(item=>item.id===row[key]);
          if(!ref||typeFilter&&ref.typeId!==typeFilter)rowErrors.push(`${label}引用不存在或类型不匹配`);
        }
        if(type.startsWith('multiRef:'))row[key].forEach(id=>{if(!tables[type.slice(9)].some(item=>item.id===id))rowErrors.push(`${label}引用不存在：${id}`)});
      });
      if(row.id){if(occupiedIds.has(row.id))rowErrors.push(`编码已存在：${row.id}`);occupiedIds.add(row.id)}
      if(row.lowerLimit!=null&&row.upperLimit!=null&&row.lowerLimit>row.upperLimit)rowErrors.push('规格下限不能大于上限');
      if(row.outerDiameter!=null&&row.outerDiameter<=0)rowErrors.push('公称外径必须大于 0');
      if(row.wallThickness!=null&&row.wallThickness<=0)rowErrors.push('公称壁厚必须大于 0');
      rows.push(row);
      rowErrors.forEach(message=>errors.push(`第 ${rowNumber} 行：${message}`));
    });
    if(!rows.length&&!errors.length)errors.push('Excel 中没有可导入的数据行');
    return {rows,errors};
  }
  function adminTemplateInstructions(tableKey){
    const cfg=adminTables[tableKey];
    return cfg.fields.map(([key,label,type,required])=>{
      let note=required?'必填':'选填';
      if(type.startsWith('ref:'))note+='；填写已存在数据的编码';
      if(type.startsWith('multiRef:'))note+='；填写已存在数据的编码，多个值用英文逗号分隔';
      if(type.startsWith('multi:'))note+=`；可选值：${type.slice(6).split(',').map(value=>processFactorLabels[value]||value).join('、')}，多个值用英文逗号分隔`;
      if(type.startsWith('select:'))note+=`；可选值：${type.slice(7).split(',').join('、')}`;
      if(type==='datetime-local')note+='；格式：YYYY-MM-DD HH:mm';
      if(type==='number')note+='；填写有效数字';
      return [cfg.label,label,note];
    });
  }
  function downloadAdminTemplate(groupKey){
    if(typeof XLSX==='undefined'){toast('Excel 组件未加载，请联网后重试',true);return}
    const group=adminImportGroups[groupKey];
    if(!group)return;
    const workbook=XLSX.utils.book_new(),instructions=[['数据类别','字段','填写说明']];
    group.tables.forEach(tableKey=>{
      const cfg=adminTables[tableKey],headers=cfg.fields.map(([,label,,required])=>required?`${label} *`:label),sheet=XLSX.utils.aoa_to_sheet([headers]);
      sheet['!cols']=cfg.fields.map(([,label])=>({wch:Math.max(14,Math.min(24,label.length*2+4))}));
      sheet['!autofilter']={ref:XLSX.utils.encode_range({s:{r:0,c:0},e:{r:0,c:headers.length-1}})};
      XLSX.utils.book_append_sheet(workbook,sheet,cfg.label);
      instructions.push(...adminTemplateInstructions(tableKey));
    });
    XLSX.utils.book_append_sheet(workbook,XLSX.utils.aoa_to_sheet(instructions),'填写说明');
    XLSX.writeFile(workbook,`数据管理_${group.label}_模板.xlsx`);
  }
  function validateAdminImportGroup(groupKey,workbook){
    const group=adminImportGroups[groupKey],errors=[],rowsByTable=Object.fromEntries(group.tables.map(tableKey=>[tableKey,[]]));
    const tables={...adminState.tables};
    const tableBySheet=Object.fromEntries(group.tables.map(tableKey=>[adminTables[tableKey].label,tableKey]));
    let importedSheetCount=0;
    workbook.SheetNames.forEach(sheetName=>{
      if(sheetName==='填写说明')return;
      const tableKey=tableBySheet[sheetName],sheet=workbook.Sheets[sheetName];
      if(!tableKey){
        if(sheet&&XLSX.utils.sheet_to_json(sheet,{header:1,defval:null,blankrows:false}).some(row=>row.some(value=>value!=null&&String(value).trim()!=='')))errors.push(`无法识别工作表：${sheetName}`);
        return;
      }
      const grid=XLSX.utils.sheet_to_json(sheet,{header:1,defval:null,raw:true,blankrows:false});
      if(grid.length<2||!grid.slice(1).some(row=>row.some(value=>value!=null&&String(value).trim()!=='')))return;
      importedSheetCount++;
      const result=validateAdminImport(tableKey,grid,tables);
      errors.push(...result.errors.map(error=>`${adminTables[tableKey].label}：${error}`));
      rowsByTable[tableKey]=result.rows;
      if(!result.errors.length)tables[tableKey]=[...tables[tableKey],...result.rows];
    });
    if(!importedSheetCount&&!errors.length)errors.push('Excel 中没有可导入的数据');
    return {rowsByTable,errors};
  }
  async function previewAdminImport(file,groupKey){
    if(!file)return;
    if(!/\.(xlsx|xls)$/i.test(file.name)){toast('请选择 .xlsx 或 .xls 文件',true);return}
    if(typeof XLSX==='undefined'){toast('Excel 组件未加载，请联网后重试',true);return}
    try{
      const workbook=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:true});
      if(!workbook.SheetNames.length)throw new Error('工作簿中没有可读取的工作表');
      const result=validateAdminImportGroup(groupKey,workbook),entries=Object.entries(result.rowsByTable).filter(([,rows])=>rows.length),totalRows=entries.reduce((sum,[,rows])=>sum+rows.length,0);
      pendingAdminImport={groupKey,rowsByTable:result.rowsByTable,errors:result.errors};
      const preview=entries.map(([tableKey,rows])=>{
        const cfg=adminTables[tableKey],previewRows=rows.slice(0,5);
        return `<h3>${esc(cfg.label)} · ${rows.length} 行</h3><div class="import-preview"><table><thead><tr>${cfg.columns.map(key=>`<th>${esc(key)}</th>`).join('')}</tr></thead><tbody>${previewRows.map(row=>`<tr>${cfg.columns.map(key=>`<td>${esc(Array.isArray(row[key])?row[key].join('、'):row[key]??'')}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
      }).join('');
      const errors=result.errors.length?`<ul class="import-errors">${result.errors.slice(0,40).map(error=>`<li>${esc(error)}</li>`).join('')}${result.errors.length>40?`<li>另有 ${result.errors.length-40} 项错误</li>`:''}</ul>`:'';
      openModal('Excel 导入预览',`<div class="warnline">${esc(file.name)} · 共检查 ${entries.length} 类数据、${totalRows} 行。${result.errors.length?'发现错误，需修正 Excel 后重新上传；未写入任何数据。':'校验通过，确认后将整批写入。'}</div>${preview}${errors}<div class="import-actions"><button type="button" class="btn" id="cancelAdminImport">取消</button><button type="button" class="btn primary" id="confirmAdminImport" ${result.errors.length||!totalRows?'disabled':''}>确认导入 ${totalRows} 行</button></div>`);
      $('#cancelAdminImport').onclick=()=>{pendingAdminImport=null;$('#modal').classList.remove('open')};
      $('#confirmAdminImport').onclick=commitAdminImport;
    }catch(error){pendingAdminImport=null;toast(`无法读取 Excel：${error.message||'文件格式错误'}`,true)}
  }
  function commitAdminImport(){
    const pending=pendingAdminImport;
    if(!pending||pending.errors.length)return;
    const entries=Object.entries(pending.rowsByTable).filter(([,rows])=>rows.length),totalRows=entries.reduce((sum,[,rows])=>sum+rows.length,0),oldRows=Object.fromEntries(entries.map(([tableKey])=>[tableKey,adminState.tables[tableKey]]));
    if(!totalRows)return;
    entries.forEach(([tableKey,rows])=>{adminState.tables[tableKey]=[...adminState.tables[tableKey],...rows]});
    if(!saveAdminState()){Object.assign(adminState.tables,oldRows);return}
    const [firstTable]=entries[0];
    pendingAdminImport=null;$('#modal').classList.remove('open');adminState.activeTab=firstTable;adminState.query='';toast(`已导入 ${totalRows} 条数据，涉及 ${entries.length} 类`);renderAdminPage();
  }
  function adminFieldControl(tableKey,field,record){
    const [key,label,type,required]=field,id=esc(`admin-${key}`),name=esc(key),requiredAttr=required?'required':'';
    if(type.startsWith('ref:')){
      const [refKey,typeFilter]=type.slice(4).split(':'),items=adminState.tables[refKey].filter(x=>!typeFilter||x.typeId===typeFilter);
      return `<div class="field"><label for="${id}">${label}${required?' *':''}</label><select class="select" id="${id}" name="${name}" ${requiredAttr}><option value="">请选择</option>${items.map(x=>`<option value="${esc(x.id)}" ${record?.[key]===x.id?'selected':''}>${esc(x.name||x.id)} · ${esc(x.id)}</option>`).join('')}</select></div>`;
    }
    if(type.startsWith('multiRef:')){
      const refKey=type.slice(9),items=adminState.tables[refKey],selected=record?.[key]||[];
      return `<div class="field"><label for="${id}">${label}${required?' *':''}</label><select class="select" id="${id}" name="${name}" multiple ${requiredAttr}>${items.map(x=>`<option value="${esc(x.id)}" ${selected.includes(x.id)?'selected':''}>${esc(x.name||x.id)} · ${esc(x.id)}</option>`).join('')}</select></div>`;
    }
    if(type.startsWith('multi:')){
      const keys=type.slice(6).split(',');
      return `<div class="field"><label>${label}</label><div class="admin-form-checks">${keys.map(value=>`<label><input type="checkbox" name="${name}" value="${value}" ${(record?.[key]||[]).includes(value)?'checked':''}>${processFactorLabels[value]||value}</label>`).join('')}</div></div>`;
    }
    if(type.startsWith('select:')){
      const choices=type.slice(7).split(',');
      return `<div class="field"><label for="${id}">${label}${required?' *':''}</label><select class="select" id="${id}" name="${name}" ${requiredAttr}>${choices.map(value=>`<option value="${esc(value)}" ${(record?.[key]||choices[0])===value?'selected':''}>${esc(value)}</option>`).join('')}</select></div>`;
    }
    const value=record?.[key]??'',step=type==='number'?'step="any"':'';
    return `<div class="field"><label for="${id}">${label}${required?' *':''}</label><input class="input" id="${id}" name="${name}" type="${type}" value="${esc(value)}" ${step} ${requiredAttr} ${key==='id'&&record?'readonly':''}></div>`;
  }
  function renderAdminPage(){
    const cfg=adminTables[adminState.activeTab]||adminTables.categories,rows=adminState.tables[adminState.activeTab]||[],query=(adminState.query||'').trim().toLocaleLowerCase();
    const visible=rows.map((row,index)=>({row,index})).filter(({row})=>!query||cfg.columns.some(column=>adminCell(adminState.activeTab,row,column).toLocaleLowerCase().includes(query)));
    const counts=[['产品主数据',adminState.tables.categories.length+adminState.tables.specs.length],['设备台账',adminState.tables.equipmentTypes.length+adminState.tables.equipment.length],['生产批次',adminState.tables.batches.length],['采集记录',adminState.tables.records.length]];
    const tableRows=visible.length?visible.map(({row,index})=>`<tr>${cfg.columns.map(column=>`<td class="${['id','timestamp','startTime'].includes(column)?'num':''} ${['description','specIds','influences'].includes(column)?'wrap-cell':''}">${esc(adminCell(adminState.activeTab,row,column))}</td>`).join('')}<td><div class="data-admin-actions"><button class="btn small edit-admin-row" data-index="${index}" aria-label="编辑 ${esc(row.id)}">编辑</button><button class="btn small delete-row delete-admin-row" data-index="${index}" aria-label="删除 ${esc(row.id)}">删除</button></div></td></tr>`).join(''):`<tr><td colspan="${cfg.columns.length+1}" class="table-empty">${query?'没有符合搜索条件的数据':'暂无数据'}</td></tr>`;
    $('#page-p4').innerHTML=phead('数据管理','本地演示主数据与采集数据；不接入生产系统',`<span class="tag neutral">本地模拟</span>`)+`<div class="warnline" style="margin-bottom:14px">此页面数据仅保存在当前浏览器，不会进入质量预警、R1–R5 判断或正式生产系统；清除浏览器站点数据可能导致演示数据丢失。</div><div class="data-admin-stats">${counts.map(([label,count])=>`<div class="data-admin-stat"><span>${label}</span><b class="num">${count}</b></div>`).join('')}</div><section class="panel"><div class="data-admin-toolbar"><div class="data-admin-tabs" role="tablist" aria-label="数据类别">${Object.entries(adminTables).map(([key,item])=>`<button class="data-admin-tab ${key===adminState.activeTab?'active':''}" role="tab" aria-selected="${key===adminState.activeTab}" data-admin-tab="${key}">${item.label}</button>`).join('')}</div><div class="filters"><input class="input data-admin-search" id="adminSearch" placeholder="搜索当前数据" value="${esc(adminState.query||'')}"><button class="btn primary" id="addAdminRow">＋ 新增${cfg.singular}</button></div></div><div class="table-scroll"><table class="data-admin-table"><thead><tr>${cfg.columns.map(column=>`<th>${({id:'编码 / 编号',name:'名称',categoryId:'产品类别',outerDiameter:'外径 mm',wallThickness:'壁厚 mm',ovalityMax:'不圆度上限 mm',status:'状态',typeId:'设备类型',lineName:'产线/工段',specId:'产品规格',specIds:'适用规格',extruderId:'挤出机',haulOffId:'牵引机',productionGroup:'生产组别',startTime:'生产开始时间',source:'数据来源',unit:'单位',lowerLimit:'规格下限',upperLimit:'规格上限',influences:'影响因素',batchId:'批次号',timestamp:'采集时间',minWallThickness:'最小壁厚',maxWallThickness:'最大壁厚',ovality:'不圆度',temperature:'温度 °C',pressure:'压力 MPa',haulOffSpeed:'牵引速度 m/min',dataSource:'数据来源',description:'说明'})[column]||column}</th>`).join('')}<th>操作</th></tr></thead><tbody>${tableRows}</tbody></table></div><div class="panel-body subtle">当前显示 ${visible.length} / ${rows.length} 条 · 引用按主数据编码关联，示例记录均为模拟数据。</div></section>`;
    $('.data-admin-stats').insertAdjacentHTML('afterend',`<div class="data-admin-importbar"><div><strong>Excel 批量导入</strong><span class="subtle">按数据类别下载整套模板，填写对应工作表后上传；校验通过后整批写入。</span></div><div class="filters"><select class="select" id="adminImportGroup" aria-label="选择 Excel 数据类别">${Object.entries(adminImportGroups).map(([key,item])=>`<option value="${key}">${item.label}</option>`).join('')}</select><button class="btn" id="downloadAdminTemplate">下载整套模板</button><button class="btn primary" id="chooseAdminExcel">选择 Excel 文件</button><input class="admin-file-input" id="adminExcelFile" type="file" accept=".xlsx,.xls,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet,application/vnd.ms-excel" aria-label="选择 Excel 文件"></div></div>`);
    $$('#page-p4 [data-admin-tab]').forEach(button=>button.onclick=()=>{adminState.activeTab=button.dataset.adminTab;adminState.query='';saveAdminState();renderAdminPage()});
    $('#adminSearch').oninput=event=>{adminState.query=event.target.value;renderAdminPage();const input=$('#adminSearch');input.focus();input.setSelectionRange(input.value.length,input.value.length)};
    $('#addAdminRow').onclick=()=>openAdminEditor(adminState.activeTab,null);
    $('#downloadAdminTemplate').onclick=()=>downloadAdminTemplate($('#adminImportGroup').value);
    $('#chooseAdminExcel').onclick=()=>$('#adminExcelFile').click();
    $('#adminExcelFile').onchange=event=>{const file=event.target.files?.[0];event.target.value='';previewAdminImport(file,$('#adminImportGroup').value)};
    $$('#page-p4 .edit-admin-row').forEach(button=>button.onclick=()=>openAdminEditor(adminState.activeTab,Number(button.dataset.index)));
    $$('#page-p4 .delete-admin-row').forEach(button=>button.onclick=()=>deleteAdminRow(adminState.activeTab,Number(button.dataset.index)));
  }
  function openAdminEditor(tableKey,index){
    const cfg=adminTables[tableKey],record=index==null?null:adminState.tables[tableKey][index];
    openModal(`${record?'编辑':'新增'}${cfg.singular}`,`<form id="adminEditorForm"><div class="admin-form">${cfg.fields.map(field=>adminFieldControl(tableKey,field,record)).join('')}</div><div class="admin-editor-actions"><button type="button" class="btn" id="cancelAdminEdit">取消</button><button type="submit" class="btn primary">保存到本地</button></div></form>`);
    $('#cancelAdminEdit').onclick=()=>$('#modal').classList.remove('open');
    $('#adminEditorForm').onsubmit=event=>{
      event.preventDefault();const form=new FormData(event.currentTarget),next={};
      cfg.fields.forEach(([key,,type])=>{
        if(type.startsWith('multi:')||type.startsWith('multiRef:'))next[key]=form.getAll(key);
        else if(type==='number')next[key]=form.get(key)===''?null:Number(form.get(key));
        else next[key]=String(form.get(key)||'').trim();
      });
      if(tableKey==='records')next.dataSource=String(form.get('dataSource')||'演示录入');
      if((next.lowerLimit!=null&&next.upperLimit!=null&&next.lowerLimit>next.upperLimit)||(next.outerDiameter!=null&&next.outerDiameter<=0)||(next.wallThickness!=null&&next.wallThickness<=0)){toast('请检查上下限顺序及规格数值',true);return}
      if(index==null&&adminState.tables[tableKey].some(row=>row.id===next.id)){toast('该编码已存在，请使用唯一编码',true);return}
      const original=record;
      adminState.tables[tableKey][index==null?adminState.tables[tableKey].length:index]=next;
      if(!saveAdminState()){
        if(index==null)adminState.tables[tableKey].pop();else adminState.tables[tableKey][index]=original;
        return;
      }
      $('#modal').classList.remove('open');toast(`${cfg.singular}已保存到本地演示数据`);renderAdminPage();
    };
  }
  function deleteAdminRow(tableKey,index){
    const row=adminState.tables[tableKey][index],refs=adminDeleteReferences(tableKey,row);
    if(refs.length){toast(`无法删除：仍被${refs.join('、')}引用，请先解除关联`,true);return}
    if(!confirm(`确认从本地演示数据中删除“${adminCell(tableKey,row,'id')}”吗？`))return;
    const [removed]=adminState.tables[tableKey].splice(index,1);
    if(!saveAdminState()){adminState.tables[tableKey].splice(index,0,removed);return}
    toast('演示数据已删除');renderAdminPage();
  }
  function bindGlobal(){
    $$('.nav-item').forEach(b=>b.onclick=()=>nav(b.dataset.page));$('#scenarioSelect').onchange=e=>{state.scenario=e.target.value;state.selectedEvent=null;state.selectedRecord=null;state.metric=e.target.value==='B'?'ovality':e.target.value==='D'?'outerDiameter':'minWallThickness';save();toast(`已切换至场景 ${e.target.value}`);render()};$('#resetBtn').onclick=()=>{if(confirm('重置会清除本原型在浏览器中保存的工程师验证和 8D 草稿，是否继续？')){localStorage.removeItem(storeKey);state=structuredClone(defaults);save();toast('演示数据已恢复初始化状态');nav('p4')}};$('#collapseBtn').onclick=()=>$('#sidebar').classList.toggle('collapsed');$('#modalClose').onclick=()=>$('#modal').classList.remove('open');$('#modal').onclick=e=>{if(e.target===$('#modal'))$('#modal').classList.remove('open')};document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#modal').classList.remove('open')})
  }
  bindGlobal();initScenarioSelections();nav(state.page||'p1');
  </script>
</body>
